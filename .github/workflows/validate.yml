name: Validate application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-origin-safety:
    name: Clean origin, cooperative updates and independent recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node release1-clean-origin/prepare.mjs ci
      - run: node release1-clean-origin/run.mjs .verification-local/clean-origin/ci
      - name: Preserve synthetic isolation and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clean-origin-safety-evidence
          path: |
            .verification-local/clean-origin/ci/manifest.json
            .verification-local/clean-origin/ci/build*.log
            .verification-local/clean-origin/ci/evidence-*/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  reporting-contract:
    name: Reporting, immutable history and offline exports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test --config release1-reporting/playwright.config.mjs
      - name: Preserve synthetic reporting evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release1-reporting-evidence
          path: |
            test-results/reporting-native.json
            test-results/reporting/
            playwright-report/reporting/
          retention-days: 14
          if-no-files-found: error

  release-compatibility:
    name: Chromium, Firefox, WebKit and print compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test --config remediation-phase5/playwright.config.mjs
      - name: Preserve isolated compatibility and PDF evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: phase5-compatibility-evidence
          path: |
            test-results/phase5-native.json
            test-results/phase5/
            playwright-report/phase5/
          retention-days: 14
          if-no-files-found: error

  native-restore:
    name: Native Chromium backup and restoration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:native
      - name: Preserve synthetic native evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-restore-evidence
          path: |
            test-results/native-results.json
            test-results/native/
            playwright-report/
          retention-days: 14
          if-no-files-found: error

  quality:
    name: TypeScript, regression tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Static repository validation
        run: node scripts/validate-repository.mjs
      - name: TypeScript
        run: npx tsc -p tsconfig.json --noEmit --incremental false
      - name: All original and Phase 1 regression tests
        run: npx vitest run tests --reporter=default --reporter=json --outputFile=test-results/standard.json
      - name: Production build (validation only)
        run: npm run build
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standard-test-evidence
          path: test-results/standard.json
          retention-days: 14
          if-no-files-found: error

  release-acceptance:
    name: Full Release 1 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: All acceptance assertions, including outstanding defects
        run: npx vitest run --config remediation-phase1/vitest.review.config.mts --reporter=default --reporter=json --outputFile=test-results/acceptance.json
      - name: Preserve acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-acceptance-evidence
          path: test-results/acceptance.json
          retention-days: 14
          if-no-files-found: error
